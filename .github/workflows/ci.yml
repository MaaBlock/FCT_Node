name: Build and Test

on:
  push:
    branches: [ "main", "dev", "feat/*" ]
  pull_request:
    branches: [ "main", "dev", "feat/*" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: build/tests
      run: |
        .\Release\InteropTest.exe
        .\Release\ExtendedTests.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y git cmake ninja-build g++-10 python3 make curl zip unzip tar pkg-config perl
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 --slave /usr/bin/g++ g++ /usr/bin/g++-10

    - uses: actions/checkout@v4

    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run Tests
      working-directory: build/tests
      run: |
        ./InteropTest
        ./ExtendedTests

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build and Test in ARM64 Docker
      run: |
        docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:20.04 bash -c "
          apt-get update && \
          apt-get install -y git cmake ninja-build g++-10 python3 make curl zip unzip tar pkg-config perl && \
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 --slave /usr/bin/g++ g++ /usr/bin/g++-10 && \
          git clone https://github.com/microsoft/vcpkg.git && \
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics && \
          export VCPKG_ROOT=\$PWD/vcpkg && \
          cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release && \
          cmake --build build && \
          cd build/tests && \
          ./InteropTest && \
          ./ExtendedTests
        "
