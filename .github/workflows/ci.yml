name: Build and Test

on:
  push:
    branches: [ "main", "dev", "feat/*" ]
  pull_request:
    branches: [ "main", "dev", "feat/*" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: build/tests
      run: |
        .\Release\InteropTest.exe
        .\Release\ExtendedTests.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      LC_ALL: zh_CN.UTF-8
    steps:
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y software-properties-common gnupg ca-certificates locales
        add-apt-repository ppa:deadsnakes/ppa -y
        add-apt-repository ppa:ubuntu-toolchain-r/test -y
        apt-get update
        apt-get install -y git cmake ninja-build gcc-13 g++-13 python3.9 python3.9-dev make curl zip unzip tar pkg-config perl
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 100
        locale-gen zh_CN.UTF-8

    - uses: actions/checkout@v4

    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run Tests
      working-directory: build/tests
      run: |
        ./InteropTest
        ./ExtendedTests

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh
      LC_ALL: zh_CN.UTF-8
    steps:
    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y software-properties-common gnupg ca-certificates locales
        add-apt-repository ppa:deadsnakes/ppa -y
        add-apt-repository ppa:ubuntu-toolchain-r/test -y
        apt-get update
        apt-get install -y git cmake ninja-build gcc-13 g++-13 python3.9 python3.9-dev make curl zip unzip tar pkg-config perl
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.9 100
        locale-gen zh_CN.UTF-8

    - uses: actions/checkout@v4

    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -S . -GNinja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run Tests
      working-directory: build/tests
      run: |
        ./InteropTest
        ./ExtendedTests
        ./PromiseTest
        ./StressTest
        ./CustomModulePathTest
